
<!DOCTYPE html>
<html>
<head>
    <title>My To Do List</title>

    <style>
        body {
            font-family: Arial;
            background: #f1e6ff;
            text-align: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 25px;
            width: 320px;
            margin: auto;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            background: purple;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            background: #eee;
            padding: 10px;
            margin: 10px;
            list-style: none;
            display: flex;
            justify-content: space-between;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>My To-Do List 📝</h2>

        <input type="text" id="task"
        placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let input = document.getElementById("task");
            let value = input.value.trim();

            if (value === "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");

            let span = document.createElement("span");
            span.innerText = value;

            span.onclick = function() {
                span.classList.toggle("done");
            };

            let btn = document.createElement("button");
            btn.innerText = "Delete";

            btn.onclick = function() {
                li.remove();
            };

            li.appendChild(span);
            li.appendChild(btn);

            document.getElementById("taskList")
            .appendChild(li);

            input.value = "";
        }
    </script>

</body>
</html>
